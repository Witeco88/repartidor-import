<!doctype html><html lang="ca"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Import">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><title>Repartidor d'import</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e8edf3;--soft:#f1f5f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
main{max-width:520px;margin:auto;padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:#0f172a;color:white;display:grid;place-items:center;font-size:23px;font-weight:700}
h1{font-size:25px;letter-spacing:-.6px;margin:0}.subtitle{color:var(--muted);font-size:14px;margin:3px 0 0}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 10px 35px rgba(15,23,42,.06);margin-bottom:14px}
.label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}
.inputwrap{display:flex;align-items:center;background:var(--soft);border-radius:16px;padding:0 16px}
input{width:100%;border:0;outline:0;background:transparent;padding:15px 0;font-size:34px;font-weight:700;color:var(--text);min-width:0}.euro{font-size:20px;color:var(--muted);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;padding:17px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.pct{color:var(--muted);font-size:15px}.pct strong{color:var(--text);font-size:17px}.value{font-size:25px;font-weight:750}
.total{display:flex;justify-content:space-between;margin-top:12px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}.total b{color:var(--text);font-size:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}button{border:0;border-radius:14px;padding:14px 10px;font-size:15px;font-weight:650;cursor:pointer;background:var(--soft);color:var(--text)}button.primary{background:#0f172a;color:white}
.history-head{display:flex;justify-content:space-between;align-items:center}.history-head h2{font-size:17px;margin:0}.clear{background:none;color:var(--muted);font-size:13px;padding:5px}.item{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}.item:last-child{border:0}.item small{color:var(--muted)}.item b{display:block;font-size:16px}.right{text-align:right}.empty{text-align:center;color:var(--muted);padding:15px 0;font-size:14px}
.note{text-align:center;color:#94a3b8;font-size:12px;margin-top:16px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:white;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}
</style></head><body><main>
<header><div class="brand"><div class="logo">€</div><div><h1>Repartidor</h1><p class="subtitle">63,4% · 36,6%</p></div></div></header>
<section class="card"><div class="label">Import rebut</div><div class="inputwrap"><input id="amount" inputmode="decimal" type="text" placeholder="0,00" autocomplete="off"><span class="euro">€</span></div></section>
<section class="card"><div class="row"><div class="pct"><strong>63,4%</strong></div><div class="value" id="r634">0,00 €</div></div>
<div class="row"><div class="pct"><strong>36,6%</strong></div><div class="value" id="r366">0,00 €</div></div>
<div class="total"><span>Total</span><b id="total">0,00 €</b></div>
<div class="actions"><button class="primary" id="copy">⧉ &nbsp;Copiar</button><button id="share">↗ &nbsp;Compartir</button><button id="clear">⌫ &nbsp;Netejar</button><button id="save">＋ &nbsp;Guardar</button></div></section>
<section class="card"><div class="history-head"><h2>Historial</h2><button class="clear" id="clearHistory">Esborrar</button></div><div id="history"></div></section>
<div class="note">Les dades es guarden només en aquest dispositiu.</div></main><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),amount=$('amount');
function parse(v){v=v.trim().replace(/\s/g,'');if(!v)return 0;if(v.includes(',')&&v.includes('.'))v=v.lastIndexOf(',')>v.lastIndexOf('.')?v.replace(/\./g,'').replace(',','.'):v.replace(/,/g,'');else if(v.includes(','))v=v.replace(',','.');return Number(v)||0}
function eur(n){return n.toLocaleString('ca-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function calc(){let n=parse(amount.value);$('r634').textContent=eur(n*.634);$('r366').textContent=eur(n*.366);$('total').textContent=eur(n)}
function toast(t){let x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
function text(){let n=parse(amount.value);return `Import rebut: ${eur(n)}\n63,4%: ${eur(n*.634)}\n36,6%: ${eur(n*.366)}`}
amount.addEventListener('input',calc);$('clear').onclick=()=>{amount.value='';calc();amount.focus()};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text());toast('Copiat ✓')}catch{toast('No s’ha pogut copiar')}};
$('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:"Repartidor",text:text()})}catch{}}else{try{await navigator.clipboard.writeText(text());toast('Copiat ✓')}catch{toast('Compartir no disponible')}}};
function getH(){try{return JSON.parse(localStorage.getItem('importHistory')||'[]')}catch{return[]}}
function render(){let h=getH(),el=$('history');if(!h.length){el.innerHTML='<div class="empty">Encara no hi ha imports guardats.</div>';return}el.innerHTML=h.map((x,i)=>`<div class="item" data-i="${i}"><div><b>${eur(x.amount)}</b><small>${x.date}</small></div><div class="right"><b>${eur(x.amount*.634)}</b><small>63,4%</small></div></div>`).join('');el.querySelectorAll('.item').forEach(e=>e.onclick=()=>{amount.value=String(h[e.dataset.i].amount).replace('.',',');calc();amount.focus()})}
$('save').onclick=()=>{let n=parse(amount.value);if(!n){toast('Introdueix un import');return}let h=getH();h.unshift({amount:n,date:new Date().toLocaleString('ca-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})});localStorage.setItem('importHistory',JSON.stringify(h.slice(0,20)));render();toast('Guardat ✓')};
$('clearHistory').onclick=()=>{localStorage.removeItem('importHistory');render();toast('Historial esborrat')};calc();render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script></body></html>
